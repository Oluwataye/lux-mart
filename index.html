<body>
    <!-- 🔐 ENHANCED AUTHENTICATION SYSTEM -->
    <script>
        (function() {
            // Enhanced Authentication Check for Lux-Mart POS
            class LuxMartAuth {
                constructor() {
                    this.currentUser = null;
                    this.init();
                }

                init() {
                    this.checkAuthentication();
                }

                checkAuthentication() {
                    // Don't check auth on login page
                    if (window.location.pathname.includes('login.html')) {
                        return;
                    }

                    const session = localStorage.getItem('luxmart_session');
                    
                    if (!session) {
                        this.redirectToLogin('not_authenticated');
                        return;
                    }

                    try {
                        const sessionData = JSON.parse(session);
                        const now = new Date().getTime();
                        
                        // Check session timeout
                        if (now - sessionData.loginTime > sessionData.sessionTimeout) {
                            this.handleSessionExpiry();
                            return;
                        }
                        
                        // Valid session
                        this.currentUser = sessionData.user;
                        this.setupSessionTimeout(sessionData.sessionTimeout);
                        
                        // Update UI with user info
                        this.updateUserInfo();
                        
                        // Log successful auth check
                        this.logEvent('auth_check_success', `User ${this.currentUser.username} authenticated`);
                        
                    } catch (error) {
                        console.error('Session error:', error);
                        this.redirectToLogin('session_error');
                    }
                }

                redirectToLogin(reason) {
                    const currentUrl = window.location.href;
                    const loginUrl = currentUrl.replace(/\/[^\/]*$/, '/login.html?reason=' + reason);
                    
                    if (!window.location.pathname.includes('login.html')) {
                        window.location.href = loginUrl;
                    }
                }

                handleSessionExpiry() {
                    localStorage.removeItem('luxmart_session');
                    this.showNotification('Session expired. Please log in again.', 'warning');
                    setTimeout(() => {
                        this.redirectToLogin('session_expired');
                    }, 2000);
                }

                setupSessionTimeout(timeoutDuration) {
                    // Reset timeout on user activity
                    let timeout;
                    
                    const resetTimeout = () => {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => {
                            this.handleSessionExpiry();
                        }, timeoutDuration);
                    };

                    // Set up activity listeners
                    document.addEventListener('click', resetTimeout);
                    document.addEventListener('keypress', resetTimeout);
                    document.addEventListener('mousemove', resetTimeout);

                    // Initial timeout
                    resetTimeout();
                }

                updateUserInfo() {
                    // Update cashier name in header
                    const cashierElement = document.getElementById('current-time')?.previousElementSibling;
                    if (cashierElement && this.currentUser) {
                        cashierElement.innerHTML = `<div class="font-medium">Cashier: ${this.currentUser.name}</div>`;
                    }

                    // Update logout button if exists
                    const logoutBtn = document.getElementById('logoutBtn');
                    if (logoutBtn) {
                        logoutBtn.addEventListener('click', () => this.logout());
                    }
                }

                logout() {
                    if (confirm('Are you sure you want to logout?')) {
                        this.logEvent('logout', `User ${this.currentUser.username} logged out`);
                        localStorage.removeItem('luxmart_session');
                        this.redirectToLogin('logout');
                    }
                }

                showNotification(message, type = 'info') {
                    const notification = document.createElement('div');
                    notification.className = `fixed top-20 right-4 p-4 rounded-lg shadow-lg z-50 max-w-sm transform transition-all duration-300`;
                    
                    const colors = {
                        success: 'bg-green-500 text-white',
                        error: 'bg-red-500 text-white',
                        warning: 'bg-yellow-500 text-white',
                        info: 'bg-blue-500 text-white'
                    };
                    
                    notification.className += ' ' + (colors[type] || colors.info);
                    notification.innerHTML = `
                        <div class="flex items-center">
                            <span class="mr-2">${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</span>
                            <span>${message}</span>
                        </div>
                    `;
                    
                    document.body.appendChild(notification);
                    
                    // Animate in
                    setTimeout(() => {
                        notification.style.transform = 'translateX(0)';
                    }, 100);
                    
                    // Remove after 3 seconds
                    setTimeout(() => {
                        notification.style.transform = 'translateX(100%)';
                        setTimeout(() => notification.remove(), 300);
                    }, 3000);
                }

                logEvent(eventType, description) {
                    const logs = JSON.parse(localStorage.getItem('pos_audit_logs') || '[]');
                    logs.push({
                        timestamp: new Date().toISOString(),
                        eventType: eventType,
                        description: description,
                        userId: this.currentUser?.id,
                        username: this.currentUser?.username,
                        page: window.location.pathname
                    });
                    
                    if (logs.length > 1000) {
                        logs.splice(0, logs.length - 1000);
                    }
                    
                    localStorage.setItem('pos_audit_logs', JSON.stringify(logs));
                }

                getCurrentUser() {
                    return this.currentUser;
                }

                isAuthenticated() {
                    return this.currentUser !== null;
                }

                hasRole(role) {
                    return this.currentUser && this.currentUser.role === role;
                }

                hasPermission(permission) {
                    if (!this.currentUser) return false;
                    if (this.currentUser.role === 'super_admin') return true;
                    return this.currentUser.permissions && this.currentUser.permissions.includes(permission);
                }
            }

            // Initialize enhanced auth
            window.luxMartAuth = new LuxMartAuth();
        })();
    </script>
